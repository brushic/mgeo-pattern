<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Морская геодезия · Генератор точечного паттерна</title>
<style>
:root{--deep:#0F1021;--ocean:#43D7FF;--panel:#14162b;--line:#262a4a;--ink:#e8ecff;--mute:#8c93b8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07080f;color:var(--ink);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{display:flex;height:100vh}
#stage{flex:1;position:relative;min-width:0;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#camBar{position:absolute;left:14px;top:12px;display:flex;gap:6px;align-items:center;z-index:2}
#camBar span{color:var(--mute);font-size:12px;margin-right:4px}
#camBar button{background:#14162bcc;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
#camBar button.on{background:var(--ocean);color:#04121a;border-color:var(--ocean);font-weight:600}
#hud{position:absolute;left:14px;bottom:12px;color:var(--mute);font-size:12px;pointer-events:none;text-shadow:0 1px 2px #000}
#hint{position:absolute;right:14px;bottom:12px;color:var(--mute);font-size:12px;pointer-events:none;text-shadow:0 1px 2px #000}
#panel{width:340px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px 28px}
h1{font-size:15px;margin:0 0 2px;font-weight:600}
.sub{color:var(--mute);margin:0 0 12px;font-size:12px}
details{border-top:1px solid var(--line);padding:8px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600;font-size:13px;padding:4px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--mute)}
details:not([open]) summary::after{content:"▸"}
.row{margin:8px 0}
.row .top{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-bottom:2px}
.row .top b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ocean);margin:0;height:18px}
select,input[type=number],button.btn,.fileLabel{width:100%;background:#0c0e22;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit}
button.btn{cursor:pointer;text-align:center}
button.btn:hover,.fileLabel:hover{border-color:var(--ocean)}
button.primary{background:var(--ocean);color:#04121a;border-color:var(--ocean);font-weight:600}
button.primary:hover{filter:brightness(1.1)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--line);background:#0c0e22;color:var(--ink);cursor:pointer;font:inherit}
.seg button.on{background:var(--ocean);color:#04121a;border-color:var(--ocean);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--ocean)}
.sw input[type=color]{width:30px;height:26px;border:0;background:none;padding:0;cursor:pointer}
.lbl{color:var(--mute);font-size:12px;margin:8px 0 4px}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--ink)}
.chk input{accent-color:var(--ocean)}
.fileLabel{display:block;text-align:center;cursor:pointer}
.fileLabel input{display:none}
#status{color:var(--mute);font-size:12px;margin-top:8px;min-height:32px}
audio{width:100%;margin-top:8px;height:34px;display:none}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(720px,92vw)}
#modal textarea{width:100%;height:240px;background:#0c0e22;color:var(--ink);border:1px solid var(--line);border-radius:8px;font:11px/1.3 ui-monospace,Consolas,monospace;padding:8px}
@media (max-width:820px){#app{flex-direction:column}#stage{height:55vh;flex:none}#panel{width:auto;flex:1;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv"></canvas><div id="camBar"><span>Камера:</span></div><div id="hud"></div><div id="hint">тяните — вращение · колесо — масштаб · двойной клик — сброс ракурса</div></div>
  <aside id="panel">
    <h1>Генератор точечного паттерна</h1>
    <p class="sub">Морская геодезия · сетка точек → 3D → векторный SVG</p>
    <div id="ui"></div>
    <div id="status"></div>
  </aside>
</div>
<div id="modal"><div class="box"><div class="lbl" id="modalTitle">Скопируйте текст (Ctrl+C)</div><textarea id="modalText" readonly></textarea><div class="grid2" style="margin-top:10px"><button class="btn" id="modalSel">Выделить всё</button><button class="btn" id="modalClose">Закрыть</button></div></div></div>
<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  { id: 'a4l', n: 'A4 альбомная (297×210 мм)', w: 297, h: 210, u: 'mm' },
  { id: 'a3p', n: 'A3 портрет (297×420 мм)', w: 297, h: 420, u: 'mm' },
  { id: 'a3l', n: 'A3 альбомная (420×297 мм)', w: 420, h: 297, u: 'mm' },

/* ---------- параметры ---------- */
const BASE = {
  surface: 'depth', noise: 'terraced', scale: 1.3, amp: 0.55, octaves: 4, lac: 2.0, gain: 0.5, warp: 0.5, steps: 9, seed: 7,
  N: 170, stretch: 1, field: 1.5, size: 2.2, sizeVar: 0.25, sizeNoise: 0.3, sizeDepth: 0.3, thin: 0.2,
  rx: -52, ry: 0, rz: -12, proj: 'persp', persp: 0.4, zoom: 1,
  bg: '#0F1021', fg: '#43D7FF', accent: '#FFFFFF', accentShare: 0, bgInSvg: true, format: 'screen',

  depth: { surface: 'depth', noise: 'terraced', scale: 1.3, amp: 0.55, octaves: 4, warp: 0.5, steps: 9, N: 170, stretch: 1, size: 2.2, sizeNoise: 0.3, thin: 0.2, rx: -52, ry: 0, rz: -12, persp: 0.4 },
  wave:  { surface: 'wave', noise: 'sine', scale: 1.1, amp: 0.5, octaves: 2, warp: 0.4, N: 90, stretch: 1, size: 3.4, sizeNoise: 0.5, thin: 0, rx: -62, ry: 0, rz: -8, persp: 0.5 },

const state = Object.assign({}, BASE);
const DRAW_ONLY = new Set(['rx', 'ry', 'rz', 'proj', 'persp', 'zoom', 'size', 'sizeVar', 'sizeNoise', 'sizeDepth', 'bg', 'fg', 'accent', 'accentShare', 'bgInSvg', 'format']);

/* ---------- 3D simplex noise ---------- */

/* ---------- поле шума ---------- */

/* ---------- геометрия сцены ---------- */

/* ---------- отрисовка ---------- */

/* ---------- цикл ---------- */
let dirtyBuild = true, dirtyDraw = true, running = false, last = 0;
function loop(ts) {
  const dt = Math.min(0.1, (ts - last) / 1000); last = ts;
  let again = false;
  if (audio.on) { readAudio(); dirtyBuild = true; again = true; }
  if (state.play) { state.t += dt * (state.speed + (audio.on ? audio.mid * state.influence * 2 : 0)); dirtyBuild = true; again = true; syncT(); }

  save(); kick();
}
function save() { try { localStorage.setItem('mgeo-gen-v2', JSON.stringify(state)); } catch (e) {} }

/* ---------- интерфейс ---------- */
const ui = $('#ui'), controls = {};
function group(title, open) { const d = el('details'); if (open) d.open = true; d.appendChild(el('summary', '', title)); ui.appendChild(d); return d; }
function slider(parent, key, label, min, max, step, fmt, showIf) {
  const row = el('div', 'row'), top = el('div', 'top'), l = el('span', '', label), b = el('b'), inp = el('input');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step;
  const f = fmt || (v => (+v).toFixed(step < 0.1 ? 2 : step < 1 ? 1 : 0));
  const upd = () => { inp.value = state[key]; b.textContent = f(state[key]); if (showIf) row.style.display = showIf() ? '' : 'none'; };
  inp.oninput = () => { state[key] = +inp.value; b.textContent = f(state[key]); change(key); };
  top.append(l, b); row.append(top, inp); parent.appendChild(row);
  controls[key] = { upd, row, showIf }; upd();
}
function selectBox(parent, key, label, opts) {
  const row = el('div', 'row'); row.appendChild(el('div', 'lbl', label));
  const s = el('select'); opts.forEach(([v, t]) => { const o = el('option'); o.value = v; o.textContent = t; s.appendChild(o); });
  s.onchange = () => { state[key] = s.value; change(key); refreshAll(); };
  row.appendChild(s); parent.appendChild(row); controls[key] = { upd: () => { s.value = state[key]; } }; controls[key].upd();
}
function swatches(parent, key, label) {
  const row = el('div', 'row'); row.appendChild(el('div', 'lbl', label));
  const box = el('div', 'sw'), btns = [];
  PALETTE.forEach(p => { const b = el('button'); b.style.background = p.c; b.title = p.n; b.onclick = () => { state[key] = p.c; change(key); refreshAll(); }; box.appendChild(b); btns.push([b, p.c]); });
  const ci = el('input'); ci.type = 'color'; ci.title = 'Свой цвет'; ci.oninput = () => { state[key] = ci.value.toUpperCase(); change(key); refreshAll(); };
  box.appendChild(ci); row.appendChild(box); parent.appendChild(row);
  controls[key] = { upd: () => { btns.forEach(([b, c]) => b.classList.toggle('on', c.toLowerCase() === state[key].toLowerCase())); ci.value = state[key].toLowerCase(); } }; controls[key].upd();
}
function button(parent, text, fn, cls) { const b = el('button', 'btn' + (cls ? ' ' + cls : ''), text); b.onclick = fn; parent.appendChild(b); return b; }
function checkbox(parent, key, label) {
  const row = el('label', 'chk'), c = el('input'); c.type = 'checkbox'; c.onchange = () => { state[key] = c.checked; change(key); };
  row.append(c, document.createTextNode(label)); parent.appendChild(row); controls[key] = { upd: () => { c.checked = !!state[key]; } }; controls[key].upd();
}
function refreshAll() { Object.values(controls).forEach(c => { c.upd(); if (c.showIf) c.row.style.display = c.showIf() ? '' : 'none'; }); segUpdate(); }
function syncT() { if (controls.t) controls.t.upd(); }

/* тип графики */
const g1 = group('Тип графики', true);
const seg = el('div', 'seg'), segB = {};
[['depth', 'Карта глубин'], ['wave', 'Волна'], ['storm', 'Шторм']].forEach(([id, t]) => {
  const b = el('button', '', t); b.onclick = () => { Object.assign(state, PRESETS[id]); change('surface'); dirtyBuild = true; refreshAll(); };
  seg.appendChild(b); segB[id] = b;
});
g1.appendChild(seg);
const segUpdate = () => Object.entries(segB).forEach(([id, b]) => b.classList.toggle('on', state.surface === id));
const rowSeed = el('div', 'grid2'); rowSeed.style.marginTop = '8px';
button(rowSeed, '🎲 Новая вариация', () => {
  state.seed = 1 + Math.floor(Math.random() * 9999);
  state.scale = clamp(state.scale * (0.85 + Math.random() * 0.3), 0.3, 4);
  state.warp = clamp(0.2 + Math.random() * 0.9, 0, 2);
  state.amp = clamp(state.amp * (0.85 + Math.random() * 0.3), 0.05, 2);
  change('seed'); refreshAll();
});
button(rowSeed, 'Сбросить всё', () => { Object.assign(state, BASE, PRESETS.depth); change('surface'); dirtyBuild = true; refreshAll(); });
g1.appendChild(rowSeed);

/* шум */
const g2 = group('Шум (математика)', true);
selectBox(g2, 'noise', 'Тип шума', NOISES);
slider(g2, 'scale', 'Масштаб', 0.2, 4, 0.01);
slider(g2, 'amp', 'Амплитуда (высота рельефа)', 0, 2, 0.01);
slider(g2, 'octaves', 'Октавы (детализация)', 1, 6, 1);
slider(g2, 'lac', 'Лакунарность', 1.2, 3.5, 0.05);
slider(g2, 'gain', 'Затухание октав', 0.2, 0.9, 0.01);
slider(g2, 'warp', 'Искажение (domain warp)', 0, 2, 0.01);
slider(g2, 'steps', 'Число ступеней', 2, 24, 1, null, () => state.noise === 'terraced');
{ const row = el('div', 'row'); row.appendChild(el('div', 'lbl', 'Seed (зерно случайности)'));
  const n = el('input'); n.type = 'number'; n.min = 1; n.max = 99999; n.step = 1; n.oninput = () => { state.seed = Math.max(1, Math.floor(+n.value || 1)); change('seed'); };
  row.appendChild(n); g2.appendChild(row); controls.seed = { upd: () => { n.value = state.seed; } }; controls.seed.upd(); }

/* точки */
const g3 = group('Точки', true);
slider(g3, 'N', 'Плотность (точек по высоте)', 40, 320, 1);
slider(g3, 'stretch', 'Точек вдоль линии (×)', 1, 8, 0.1);
slider(g3, 'field', 'Размер поля', 0.6, 3, 0.01);
slider(g3, 'size', 'Размер точки (‰ высоты кадра)', 0.4, 10, 0.05);
slider(g3, 'sizeVar', 'Разброс размеров', 0, 1, 0.01);
slider(g3, 'sizeNoise', 'Размер следует за шумом', 0, 1.2, 0.01);
slider(g3, 'sizeDepth', 'Размер зависит от глубины', 0, 1.5, 0.01);
slider(g3, 'thin', 'Разрежение по шуму (плотность)', 0, 1, 0.01);

/* вид */
const g4 = group('Ракурс', true);
slider(g4, 'rx', 'Наклон X, °', -180, 180, 0.5);
slider(g4, 'ry', 'Поворот Y, °', -180, 180, 0.5);
slider(g4, 'rz', 'Вращение Z, °', -180, 180, 0.5);
{ const row = el('div', 'row'); row.appendChild(el('div', 'lbl', 'Проекция'));
  const sg = el('div', 'seg'), bs = {};
  [['persp', 'Перспективная'], ['ortho', 'Параллельная']].forEach(([id, t]) => { const b = el('button', '', t); b.onclick = () => { state.proj = id; change('proj'); refreshAll(); }; sg.appendChild(b); bs[id] = b; });
  row.appendChild(sg); g4.appendChild(row);
  const cb = {};
  [['persp', 'Перспектива'], ['ortho', 'Параллельная']].forEach(([id, t]) => { const b = el('button', '', t); b.onclick = e => { e.stopPropagation(); state.proj = id; change('proj'); refreshAll(); }; b.addEventListener('pointerdown', e => e.stopPropagation()); $('#camBar').appendChild(b); cb[id] = b; });
  controls.proj = { upd: () => { Object.entries(bs).forEach(([id, b]) => b.classList.toggle('on', state.proj === id)); Object.entries(cb).forEach(([id, b]) => b.classList.toggle('on', state.proj === id)); } }; controls.proj.upd(); }
slider(g4, 'persp', 'Сила перспективы', 0, 1.5, 0.01, null, () => state.proj !== 'ortho');
slider(g4, 'zoom', 'Масштаб', 0.3, 3, 0.01);
{ const r = el('div', 'grid2'); r.style.marginTop = '8px';
  button(r, 'Сбросить ракурс', resetView);
  button(r, 'Случайный ракурс', () => { state.rx = Math.round(-90 + Math.random() * 120); state.ry = Math.round(-40 + Math.random() * 80); state.rz = Math.round(-60 + Math.random() * 120); change('rx'); refreshAll(); });
  g4.appendChild(r); }
function resetView() { const p = PRESETS[state.surface] || PRESETS.depth; state.rx = p.rx; state.ry = p.ry; state.rz = p.rz; state.zoom = 1; change('rx'); refreshAll(); }

/* цвет */
const g5 = group('Цвет (палитра бренда)', false);
swatches(g5, 'bg', 'Фон'); swatches(g5, 'fg', 'Точки'); swatches(g5, 'accent', 'Цвет акцентных точек (0% = выключены)');
slider(g5, 'accentShare', 'Акцентные точки на пиках рельефа (доля)', 0, 0.5, 0.005, v => Math.round(v * 100) + '%');

/* анимация и звук */
const g6 = group('Анимация и звук (необязательно)', false);
{ const r = el('div', 'grid2');
  const pb = button(r, '▶ Анимация', () => { state.play = !state.play; pb.textContent = state.play ? '⏸ Пауза' : '▶ Анимация'; kick(); });
  button(r, 'Время → 0', () => { state.t = 0; dirtyBuild = true; syncT(); kick(); });
  g6.appendChild(r); }
slider(g6, 'speed', 'Скорость', 0, 2, 0.01);
slider(g6, 't', 'Момент времени', 0, 120, 0.01);
{ const lab = el('label', 'fileLabel', 'Загрузить аудиофайл'); lab.style.marginTop = '8px';
  const fi = el('input'); fi.type = 'file'; fi.accept = 'audio/*'; lab.appendChild(fi); g6.appendChild(lab);
  const au = el('audio'); au.controls = true; au.id = 'audio'; g6.appendChild(au);
  fi.onchange = () => { const f = fi.files[0]; if (!f) return; au.src = URL.createObjectURL(f); au.style.display = 'block'; au.load(); setStatus('Нажмите ▶ на плеере — звук начнёт двигать точки.'); };
  let ac, an, fd;
  au.addEventListener('play', () => {
    try {
      if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); const src = ac.createMediaElementSource(au); an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an); an.connect(ac.destination); fd = new Uint8Array(an.frequencyBinCount); }
      if (ac.state === 'suspended') ac.resume();
      audio.on = true; audio._an = an; audio._fd = fd; kick();
    } catch (e) { setStatus('Не удалось включить анализ звука в этом браузере.'); }
  });
  const stop = () => { audio.on = false; audio.low = audio.mid = audio.high = 0; dirtyBuild = true; kick(); };
  au.addEventListener('pause', stop); au.addEventListener('ended', stop); }
slider(g6, 'influence', 'Влияние звука', 0, 1.5, 0.01);
function readAudio() {
  const an = audio._an, fd = audio._fd; if (!an) return;
  an.getByteFrequencyData(fd);
  const avg = (a, b) => { let s = 0; for (let i = a; i < b; i++) s += fd[i]; return s / ((b - a) * 255); };
  const n = fd.length, lo = avg(1, Math.floor(n * 0.05)), mi = avg(Math.floor(n * 0.05), Math.floor(n * 0.25)), hi = avg(Math.floor(n * 0.25), Math.floor(n * 0.6));
  audio.low += (lo - audio.low) * 0.3; audio.mid += (mi - audio.mid) * 0.3; audio.high += (hi - audio.high) * 0.3;
}

/* экспорт */
const g7 = group('Формат и экспорт', true);
selectBox(g7, 'format', 'Формат кадра', FORMATS.map(f => [f.id, f.n]));
checkbox(g7, 'bgInSvg', 'Фон внутри SVG (снимите — только точки)');
{ const r = el('div', 'grid2'); r.style.marginTop = '8px';
  button(r, '⬇ Скачать SVG', exportSVG, 'primary');
  button(r, 'Копировать SVG', copySVG);
  g7.appendChild(r);
  const r2 = el('div', 'grid2'); r2.style.marginTop = '8px';
  button(r2, 'Копировать параметры', () => copyText(JSON.stringify(state, null, 1), 'Параметры скопированы (JSON).'));
  const lab = el('label', 'fileLabel', 'Загрузить параметры'); const fi = el('input'); fi.type = 'file'; fi.accept = '.json,application/json'; lab.appendChild(fi); r2.appendChild(lab);
  fi.onchange = () => { const f = fi.files[0]; if (!f) return; f.text().then(t => { try { Object.assign(state, BASE, JSON.parse(t)); state.play = false; change('surface'); dirtyBuild = true; refreshAll(); setStatus('Параметры загружены.'); } catch (e) { setStatus('Файл параметров не прочитан.'); } }); };
  g7.appendChild(r2); }
button(g7, 'Скачать параметры (.json)', async () => { const ok = await dl('mgeo-params.json', JSON.stringify(state, null, 1), 'application/json'); setStatus(ok === true ? 'Файл параметров сохранён.' : 'Не сохранено — используйте «Копировать параметры».'); }).style.marginTop = '8px';

/* ---------- SVG ---------- */
function makeSVG() {
  const F = curFormat(), pr = project(F.w, F.h, 1), mm = F.u === 'mm', d = mm ? 3 : 1, dr = mm ? 3 : 2;
  const unit = F.u;
  const parts = [`<svg xmlns="http://www.w3.org/2000/svg" width="${F.w}${unit}" height="${F.h}${unit}" viewBox="0 0 ${F.w} ${F.h}">`];
  if (state.bgInSvg) parts.push(`<rect id="background" width="${F.w}" height="${F.h}" fill="${state.bg}"/>`);
  for (let pass = 0; pass < 2; pass++) {
    if (pass === 1 && !state.accentShare) break;
    parts.push(`<g id="${pass ? 'accent-dots' : 'dots'}" fill="${pass ? state.accent : state.fg}">`);
    for (let i = 0; i < pr.n; i++) if (pr.ac[i] === pass) parts.push(`<circle cx="${pr.xs[i].toFixed(d)}" cy="${pr.ys[i].toFixed(d)}" r="${pr.rs[i].toFixed(dr)}"/>`);
    parts.push('</g>');
  }
  parts.push('</svg>');
  return { text: parts.join('\n'), n: pr.n };
}
async function dl(name, text, mime) {
  try {
    if (window.claude && window.claude.use) {
      const d = await window.claude.use('downloads');
      if (d) { await d.save({ filename: name, data: text }); return true; }
    }
  } catch (e) { if (e && e.code === 'declined') return 'declined'; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); return true; } catch (e) { return false; }
}
async function exportSVG() {
  const s = makeSVG(); const ok = await dl(`mgeo-pattern-${state.surface}-${state.seed}.svg`, s.text, 'image/svg+xml');
  const info = `SVG: ${s.n.toLocaleString('ru-RU')} кругов, ${(s.text.length / 1048576).toFixed(1)} МБ. `;
  setStatus(ok === 'declined' ? info + 'Сохранение отменено.' : ok ? info + 'Если файл не появился, нажмите «Копировать SVG» и вставьте в файл .svg.' : info + 'Скачивание недоступно — используйте «Копировать SVG».');
}
function copySVG() { const s = makeSVG(); copyText(s.text, `SVG скопирован: ${s.n.toLocaleString('ru-RU')} кругов. Вставьте в текстовый файл и сохраните как .svg.`); }
function copyText(text, okMsg) {
  const fallback = () => { $('#modalText').value = text; $('#modal').style.display = 'flex'; $('#modalText').select(); setStatus('Буфер обмена недоступен: текст показан в окне, скопируйте вручную.'); };
  try { navigator.clipboard.writeText(text).then(() => setStatus(okMsg), fallback); } catch (e) { fallback(); }
}
$('#modalClose').onclick = () => { $('#modal').style.display = 'none'; };
$('#modalSel').onclick = () => { $('#modalText').select(); };
function setStatus(t) { $('#status').textContent = t; }

/* ---------- мышь ---------- */
let drag = null;
stage.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, rx: state.rx, rz: state.rz, ry: state.ry, shift: e.shiftKey }; stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); interacting = true; });
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (drag.shift) { state.rz = drag.rz + dx * 0.4; } else { state.ry = drag.ry + dx * 0.4; state.rx = drag.rx + dy * 0.4; }
  const norm = v => ((v + 180) % 360 + 360) % 360 - 180; state.rx = norm(state.rx); state.ry = norm(state.ry); state.rz = norm(state.rz);
  ['rx', 'ry', 'rz'].forEach(k => controls[k].upd()); dirtyDraw = true; kick();
});
const endDrag = () => { if (!drag) return; drag = null; stage.classList.remove('drag'); interacting = false; save(); dirtyDraw = true; kick(); };
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('wheel', e => { e.preventDefault(); state.zoom = clamp(state.zoom * (e.deltaY < 0 ? 1.06 : 1 / 1.06), 0.3, 3); controls.zoom.upd(); change('zoom'); }, { passive: false });
stage.addEventListener('dblclick', resetView);
window.addEventListener('resize', () => { dirtyDraw = true; kick(); });

/* ---------- старт ---------- */
refreshAll(); dirtyBuild = true; kick();
window.__mgeo = { state, makeSVG, build, project, get count() { return count; }, refreshAll, change };
})();
</script>
